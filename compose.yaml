name: flowforge

x-service: &node-service
  restart: unless-stopped
  networks: [flowforge]

x-app-service: &app-service
  <<: *node-service
  image: flowforge-app:local
  build:
    context: .
    args:
      NEXT_PUBLIC_HOOKS_URL: ${NEXT_PUBLIC_HOOKS_URL:-http://localhost:3001/hooks/catch}

x-database-env: &database-env
  DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [flowforge]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 8s
      timeout: 8s
      retries: 15
    networks: [flowforge]

  migrate:
    <<: *app-service
    environment: *database-env
    command:
      [
        "sh",
        "-c",
        "npm run migrate:deploy --workspace=@repo/db && npm run seed --workspace=@repo/db",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [flowforge]

  primary-backend:
    <<: *app-service
    command: ["npm", "run", "start", "--workspace=primary-backend"]
    environment:
      <<: *database-env
      PORT: 3002
      APP_ENV: development
      JWT_PASSWORD: ${JWT_PASSWORD:-local-development-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SMTP_ENDPOINT: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@flowforge.local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3002:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  hooks:
    <<: *app-service
    command: ["npm", "run", "start", "--workspace=hooks"]
    environment:
      <<: *database-env
      PORT: 3001
      APP_ENV: development
      WEBHOOK_BODY_LIMIT: 256kb
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  sweeper:
    <<: *app-service
    command: ["npm", "run", "start", "--workspace=sweeper"]
    environment:
      <<: *database-env
      KAFKA_BROKERS: kafka:9092
      SWEEP_INTERVAL_MS: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  worker:
    <<: *app-service
    command: ["npm", "run", "start", "--workspace=worker"]
    environment:
      <<: *database-env
      KAFKA_BROKERS: kafka:9092
      SMTP_ENDPOINT: mailpit
      SMTP_PORT: 1025
      SOL_PRIVATE_KEY: ${SOL_PRIVATE_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@flowforge.local}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
      ACTION_TIMEOUT_MS: ${ACTION_TIMEOUT_MS:-20000}
      RETRY_BASE_MS: ${RETRY_BASE_MS:-1000}
      METRICS_PORT: 3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3003:3003"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks: [flowforge]

  web:
    <<: *app-service
    command: ["npm", "run", "start", "--workspace=web", "--", "-H", "0.0.0.0"]
    environment:
      PORT: 3000
      BACKEND_INTERNAL_URL: http://primary-backend:3002
    ports:
      - "3000:3000"
    depends_on:
      primary-backend:
        condition: service_healthy
      hooks:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  flowforge:
