name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate --workspace=@repo/db
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npm run check-types
      - run: npm test
      - run: npm run build
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: npm ci && npm run smoke
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
