name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate --workspace=@repo/db
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npm run check-types
      - run: npm test
      - run: npm run build
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: npm ci && npm run smoke
      - if: always()
        run: docker compose logs --no-color && docker compose down -v

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, docker-smoke]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: flowforge-production
      cancel-in-progress: false
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/flowforge_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/flowforge_deploy ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_DOMAIN"

          ssh \
            -i ~/.ssh/flowforge_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" "$DEPLOY_DOMAIN" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          deploy_path="$1"
          expected_sha="$2"
          public_domain="$3"

          cd "$deploy_path"

          if [[ "$(git branch --show-current)" != "main" ]]; then
            echo "Deployment checkout must be on the main branch" >&2
            exit 1
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Deployment checkout has tracked local changes" >&2
            exit 1
          fi

          git fetch --prune origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$expected_sha" ]]; then
            echo "origin/main is $remote_sha, but CI approved $expected_sha" >&2
            exit 1
          fi

          git merge --ff-only origin/main
          bash deploy/remote-deploy.sh "$expected_sha" "$public_domain"
          REMOTE_SCRIPT
